<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>
    <style>
        #para{
            color: pink;
        }
        .new{
            color: green;
        }
        p{
            color: blue !important;
        }
    </style>
</head>
<body>
    <p id="para" class="new" style="color: brown;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi, similique ex. Reprehenderit repellat dolores illo mollitia, fuga saepe quaerat facilis natus error. Sapiente molestiae cumque recusandae, nam molestias laboriosam rem?</p>
</body>
</html>
