<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Design</title>
    <style>
        body{
    background-color: rgb(245,245,245);
}
        .mobile img{
            height: 500px;
            width: 500px;
            object-fit: contain;
            
        }
        .matter h1{
            color: darkblue;
            /* font-family: 'Courier New', Courier, monospace; */
            font-size: 70px;
        }
        
        .matter h3{
            font-size: 45px;
        }
        .matter ul li{
            font-size: 28px;
            line-height: 40px;
        }
        .matter button{
            background-color: rgb(81, 185, 226);
            height: 90px;
            width: 200px;
            border-radius: 40px;
            font-size: 24px;
            color: white;
            margin-right: 20px;
            border: none;
        }
        .mobile{
            display: flex;
            flex-direction: row;
            /* justify-content: left; */
            gap: 50px;
            align-items: center;
            margin-top: 40px;
            margin-left: 40px;
            
        }
    </style>
</head>
<body>
    <div class="mobile">
        <img src="mobile.png" alt="image">
        <div class="matter"><h1><b>Redmi 32 GB</b></h1>
        <h3><b>Features</b></h3>
        <ul>
            <li>128 GB Storage</li>
            <li>6 GB RAM</li>
            <li>5000 mAh Battery</li>
            <li>Snapdragon Processor</li>
            <li>90Hz Display</li>
            <li>Dual Camera</li>
        </ul>
        <button type="button">Buy Now</button>
        <button type="button">Add to wishlist</button></div>
    </div>
</body>
</html>
