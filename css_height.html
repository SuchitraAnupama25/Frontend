<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>height and width</title>
    <style>
        .one{
            height: 400px;
            width: 800px;
            background-color: aqua;
            border: 2px solid black;
        }
        .two{
            height: 400px;
            max-width: 800px;
            background-color: green;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="one">One</div>
    <div class="two">Two</div>
</body>
</html>
